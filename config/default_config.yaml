# Default configuration for localregistry
# These values are used when no user config file exists.

# Registry connection settings
registry:
  host: localhost
  port: 5000
  container_name: registry
  datadir: "$XDG_DATA_HOME/local-registry"
  username: ""
  password: ""
  insecure: false
  timeout: 30s

# Application settings
log_level: info
