# Default configuration for localregistry
# These values are used when no user config file exists.

# Registry connection settings
registry:
  host: localhost
  port: 5000
  container_name: local-container-registry
  datadir: "~/.local/share/local-container-registry"
  username: ""
  password: ""
  insecure: false
  timeout: 30s

# Application settings
log_level: info
